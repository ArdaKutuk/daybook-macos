name: PersonalSecretary
options:
  bundleIdPrefix: com.daybook
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Left empty on purpose: with no team, Xcode signs ad-hoc ("Sign to Run
    # Locally"), which is enough to run locally. For a distributable build,
    # supply real values on the command line instead of committing them:
    #   xcodebuild ... DEVELOPMENT_TEAM=XXXXXXXXXX \
    #     CODE_SIGN_IDENTITY="Developer ID Application" CODE_SIGN_STYLE=Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Release:
      # get-task-allow is a debug-only entitlement; leaving it in a Release
      # build makes the bundle ineligible for notarization.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  PersonalSecretary:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/PersonalSecretary
    info:
      path: Sources/PersonalSecretary/Resources/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        CFBundleName: Daybook
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: false
        NSHumanReadableCopyright: "© 2026"
        NSCalendarsFullAccessUsageDescription: "Daybook needs access to Calendar to display your events alongside your tasks and routines."
        NSCalendarsUsageDescription: "Daybook needs access to Calendar to display your events alongside your tasks and routines."
        LSApplicationSecondaryUIElement: false
        NSPrincipalClass: NSApplication
    entitlements:
      path: Sources/PersonalSecretary/Resources/PersonalSecretary.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daybook.PersonalSecretary
        PRODUCT_NAME: Daybook
        # The bundle ships as Daybook, but the Swift module keeps the target
        # name so `@testable import PersonalSecretary` in Tests/ resolves.
        PRODUCT_MODULE_NAME: PersonalSecretary
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    postCompileScripts: []

  PersonalSecretaryTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/PersonalSecretaryTests
    dependencies:
      - target: PersonalSecretary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daybook.PersonalSecretaryTests
        GENERATE_INFOPLIST_FILE: YES
        # The app target is named PersonalSecretary but ships as Daybook, so
        # the generated default (derived from the target name) points at an
        # executable that doesn't exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Daybook.app/Contents/MacOS/Daybook"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PersonalSecretary:
    build:
      targets:
        PersonalSecretary: all
        PersonalSecretaryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PersonalSecretaryTests
